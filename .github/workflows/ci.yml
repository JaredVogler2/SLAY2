name: ci

on:
  push:
    # main only: a branch is checked through its pull request. Running both on every push of a branch with an open pull request
    # doubled the Actions minutes (two runs of the same commit, one per event).
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  web:
    name: web (typecheck, lint, format, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm guard
      - run: pnpm licenses:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm test
      - run: pnpm build
      - name: build output is where vercel.json publishes it (apps/web/.next)
        run: test -f apps/web/.next/routes-manifest.json && test -f apps/web/.next/required-server-files.json
      - run: pnpm audit --audit-level high

  e2e:
    name: e2e (production build, Playwright desktop + mobile, axe WCAG 2.2 AA)
    runs-on: ubuntu-latest
    # the suite takes about three minutes; a step that hangs must not sit for GitHub's six-hour default
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The browser download and the apt packages come from outside the repository and twice hung for more than ten minutes
      # (the same commit's other jobs had finished in about a minute): the first attempt is bounded and one more is made.
      - name: Install Chromium for Playwright
        id: chromium
        timeout-minutes: 5
        continue-on-error: true
        run: pnpm --filter @slay2/web exec playwright install --with-deps chromium
      - name: Install Chromium for Playwright (second attempt)
        if: steps.chromium.outcome != 'success'
        timeout-minutes: 8
        run: pnpm --filter @slay2/web exec playwright install --with-deps chromium
      - name: Run the end-to-end suite against `next start`
        run: pnpm --filter @slay2/web e2e
      - name: Keep traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  sim:
    name: sim (python unit tests, provenance guard self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - name: Python tests (tests that need the external simulator skip themselves)
        run: PYTHONPATH=sim python -m pytest sim/tests -q --durations=10
      - name: Provenance guard self-test
        run: bash scripts/test-guard.sh
